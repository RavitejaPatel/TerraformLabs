name: 'Terraform CI/CD Pipeline'

on:
  push:
    branches:
      - main
  pull_request:

# Required for OIDC authentication
permissions:
  id-token: write 
  contents: read 

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest
    env:
      TF_VAR_storage_account_name: ${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }}
      TF_VAR_tfstate_container_name: ${{ secrets.TFSTATE_CONTAINER_NAME }}
      TF_VAR_azure_state_resource_group: ${{ secrets.AZURE_STATE_RESOURCE_GROUP }}
    
    # We will run this specifically in lab2 for now
    defaults:
      run:
        working-directory: ./lab2_Remote_State_Service_Principal_Auth

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Azure Login via OIDC
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0 # You can adjust the version

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="storage_account_name=${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }}" \
            -backend-config="container_name=${{ secrets.TFSTATE_CONTAINER_NAME }}" \
            -backend-config="key=lab2/terraform.tfstate" \
            -backend-config="resource_group_name=${{ secrets.AZURE_STATE_RESOURCE_GROUP }}" \
            -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan -input=false

      # Only apply on merge/push to main branch
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -input=false tfplan
